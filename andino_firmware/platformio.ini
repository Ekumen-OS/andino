; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = uno, nanoatmega328, bluepill_f103c8

; Base configuration for build tools.
[base_build]
extra_scripts = pre:scripts/version.py
build_flags =
  -I include
build_src_flags =
  -Wall -Wextra
  -Wshadow
  -Wdouble-promotion
  -Woverloaded-virtual
  -Wcast-qual
  -Wuseless-cast
  -Wnull-dereference
  -Wconversion
  -Wsign-conversion
  -Werror
check_tool = cppcheck
check_skip_packages = yes
check_flags =
  cppcheck: --enable=style,performance,portability --inline-suppr --suppress=missingIncludeSystem

; Base configuration for the boards that use the Arduino framework, whatever their platform.
[base_arduino]
framework = arduino
monitor_speed = 57600
test_ignore = drivers/*, app/*
lib_deps =
  Wire
  SPI
  adafruit/Adafruit BNO055@1.6.4
  adafruit/Adafruit BusIO@1.17.4
  adafruit/Adafruit Unified Sensor@1.1.15

; Base configuration for Atmel AVR based Arduino boards. It builds the application, the drivers and
; the BSP implementations that only use the Arduino API (bsp/arduino) or are specific to AVR
; (bsp/avr). Each board environment adds its board package (boards/<board>) to the include path.
[base_atmelavr]
platform = atmelavr
build_src_filter =
  +<main.cpp>
  +<app/>
  +<drivers/>
  +<bsp/arduino/>
  +<bsp/avr/>

; Base configuration for STM32 based Arduino boards. It builds the application, the drivers and the
; BSP implementations that only use the Arduino API (bsp/arduino) or are specific to STM32
; (bsp/stm32). The platform and its packages are pinned, because the toolchain is large and a new
; release could change the build.
[base_ststm32]
platform = ststm32@20.0.0
platform_packages =
  platformio/framework-arduinoststm32@4.30000.0
  platformio/toolchain-gccarmnoneeabi@1.120301.0
build_src_filter =
  +<main.cpp>
  +<app/>
  +<drivers/>
  +<bsp/arduino/>
  +<bsp/stm32/>
upload_protocol = stlink

; Base configuration for desktop platforms (for unit testing).
[base_desktop]
platform = native
test_framework = googletest
test_build_src = true
build_src_filter =
  +<app/app.cpp>
  +<drivers/encoder.cpp>
  +<drivers/motor.cpp>
  +<app/pid.cpp>
  +<app/shell.cpp>

; Environment for Arduino Uno.
[env:uno]
extends = base_build, base_arduino, base_atmelavr
board = uno
build_flags =
  ${base_build.build_flags}
  -I boards/arduino_uno

; Environment for Arduino Nano.
[env:nanoatmega328]
extends = base_build, base_arduino, base_atmelavr
board = nanoatmega328
build_flags =
  ${base_build.build_flags}
  -I boards/arduino_nano

; Environment for the STM32 Blue Pill (STM32F103C8T6). The serial port is the USB CDC one: the
; framework flag makes `Serial` the USB serial port and enables the USB device it needs.
[env:bluepill_f103c8]
extends = base_build, base_arduino, base_ststm32
board = bluepill_f103c8
build_flags =
  ${base_build.build_flags}
  -I boards/stm32_bluepill
  -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC

; Environment for desktop platforms (Linux). Unit tests run with AddressSanitizer and
; UndefinedBehaviorSanitizer enabled, so any detected error aborts the test run, and they are
; instrumented to measure the code coverage (see scripts/coverage.sh). The code is not optimized
; for the coverage to be accurate, and libgcov has to be linked explicitly.
[env:desktop]
extends = base_build, base_desktop
build_flags =
  ${base_build.build_flags}
  -fsanitize=address,undefined
  -fno-sanitize-recover=all
  -fno-omit-frame-pointer
  -g
  -O0
  --coverage
  -lgcov
