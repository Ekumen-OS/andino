name: MCU CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Run pre-commit checks (formatting and style linting)
        run: |
          pip install pre-commit
          pre-commit run --show-diff-on-failure --files $(git ls-files andino_firmware)

  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: actions/cache@v3
        with:
          # The platforms and packages (toolchains, frameworks) are large, specially the STM32 ones
          # (about 1.8 GB), so they are cached. The key depends on the versions in platformio.ini,
          # and a cache of an older version of the file is used to avoid downloading everything.
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/platforms
            ~/.platformio/packages
          key: ${{ runner.os }}-pio-${{ hashFiles('andino_firmware/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-
      - uses: actions/setup-python@v4
        with:
          # The version of the Docker image, which gcovr needs (3.10 or newer).
          python-version: '3.11'
      - name: Install PlatformIO Core and gcovr
        # The same pinned versions as the Docker image.
        run: pip install -r andino_firmware/docker/requirements.txt
      - name: Build application
        working-directory: ./andino_firmware
        run: pio run
      - name: Run static analysis
        working-directory: ./andino_firmware
        run: pio check --fail-on-defect=medium
      - name: Run unit tests
        working-directory: ./andino_firmware
        run: pio test --environment=desktop
      - name: Generate the code coverage report
        working-directory: ./andino_firmware
        run: |
          scripts/coverage.sh coverage
          cat coverage/summary.md >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload the code coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: andino_firmware/coverage/
      - name: Run tools unit tests
        working-directory: ./andino_firmware
        run: python -m unittest discover -s tools
